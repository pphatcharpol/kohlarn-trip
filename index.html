<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌴 ทริปล่มเกาะสีชัง 🌊</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { 
                        glassBlue: 'rgba(59, 130, 246, 0.1)',
                        glassWhite: 'rgba(255, 255, 255, 0.45)',
                        glassWhiteSolid: 'rgba(255, 255, 255, 0.7)'
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        body { 
            background-color: #f1f5f9; 
            color: #1e293b; 
            margin: 0; 
            min-height: 100vh; 
            overflow-x: hidden;
            padding-bottom: 120px; /* ระยะเว้นเผื่อ Sticky Bar สำหรับ Desktop */
        }

        @media (max-width: 768px) {
            body { padding-bottom: 110px; /* ระยะเว้นเผื่อ Sticky Bar สำหรับ Mobile */ }
        }
        
        /* 1. Liquid Background Animations */
        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background-color: #e0f2fe;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,0) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0) 0, transparent 50%);
        }

        .orb {
            position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.6; z-index: -1;
            animation: float 20s infinite ease-in-out alternate;
        }
        .orb-1 { width: 50vw; height: 50vw; top: -10%; left: -10%; background: #bae6fd; }
        .orb-2 { width: 60vw; height: 60vw; bottom: -20%; right: -10%; background: #ddd6fe; animation-delay: -5s; }
        .orb-3 { width: 40vw; height: 40vw; top: 30%; left: 40%; background: #bfdbfe; animation-delay: -10s; }

        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10vw, -10vh) scale(1.1); } }

        /* 2. Glassmorphism Utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 28px;
            box-shadow: 
                0 10px 25px -5px rgba(0, 0, 0, 0.05), 
                0 8px 10px -6px rgba(0, 0, 0, 0.02),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
        }

        /* Interactive Options */
        .option-label { cursor: pointer; display: block; height: 100%; }
        .option-input:checked + .glass-card {
            background: rgba(239, 246, 255, 0.85);
            border-color: #3b82f6;
            box-shadow: 0 12px 25px -5px rgba(59, 130, 246, 0.25), inset 0 0 0 2px #3b82f6;
            transform: translateY(-3px);
        }
        .option-input:checked + .glass-card .check-icon { transform: scale(1); opacity: 1; }
        .check-icon { transform: scale(0); opacity: 0; transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); }

        /* Sticky Summary */
        .sticky-summary {
            position: fixed;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            color: white;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.25);
            z-index: 40;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            /* Mobile Default: Full width docked to bottom */
            bottom: 0; left: 0; width: 100%;
            border-radius: 30px 30px 0 0;
            padding: 20px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        @media (min-width: 768px) {
            .sticky-summary {
                /* Desktop: Pill shape floating at bottom right */
                bottom: 24px; left: auto; right: 40px; width: 450px;
                border-radius: 999px;
                padding: 16px 32px;
                border: 1px solid rgba(255, 255, 255, 0.15);
            }
        }

        /* Animations */
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Modal Backdrop */
        .modal-backdrop {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body>

            {

                    { id: 'optB', label: 'เรือเฟอร์รี่ เหมา (15 นาที)', cost: 2100, desc: '' },
                    { id: 'optC', label: 'เรือเฟอร์รี่ ลำเล็ก ไม่เกิน 8 คน แสงประทีป (15 นาที)', cost: 1600, desc: 'เหมาลำ' }
                ]

            { id: 12, date: '2026-10-25', time: '14:00', name: 'เข้า Pool Villa บางแสนวอนนภา', desc: 'ยังไม่มีแคนดิเดทที่พัก (ตีงบไว้ก่อน)', hasOptions: false, cost: 6800 },
            { id: 13, date: '2026-10-25', time: '15:00', name: 'ตัวเลือกหลังจากนี้มีมากมาย ', desc: 'ท่านจะไปคาเฟ่ชลบุรี ไปตลาดหาซื้อไรกิน ไปเล่นน้ำบางแสน หรือไปเดินห้างก็เรื่องของท่าน', hasOptions: false, cost: 0 },
            { id: 14, date: '2026-10-25', time: '18:00', name: 'ไม่ว่าท่านจะไปไหน กลับมาหาอะไรทานมื้อใหญ่กับเพื่อน', desc: '', hasOptions: false, cost: 3100 },
            {
                id: 'trip_back', date: '2026-10-26', time: '10:30',
                name: 'ขากลับ: กลับพิษณุโลก',

                hasOptions: true,
                selectedOption: 'optA',
                syncGroup: 'transport_main', // Sync กับขาไป

                    { id: 'optA', label: 'Plan A: ขับรถส่วนตัว', cost: 2600, desc: 'ค่าใช้จ่ายรวมในขามาแล้ว' },

        const Modal = ({ title, onClose, children }) => (

                        onClick={onClose} 
                        className="absolute top-4 right-4 w-10 h-10 flex items-center justify-center bg-slate-200/60 hover:bg-red-500 text-slate-600 hover:text-white rounded-full backdrop-blur-md transition-all duration-300 shadow-sm hover:shadow-md hover:rotate-90 z-10"
                        aria-label="Close"
                    >

                    </button>

                    <div className="p-6 md:p-8 pt-8">

                        </div>
                        {children}
                    </div>

            const [members, setMembers] = useState(initialMembers);
            const [itinerary, setItinerary] = useState(initialItinerary);
            const [modals, setModals] = useState({ members: false, plan: false });

            const [newPlanType, setNewPlanType] = useState('single');
            const [newOptions, setNewOptions] = useState([{ id: 'optA', label: '', cost: 0, desc: '' }]);

            // --- Handlers ---
            const handleOptionSelect = (itemId, optionId) => {
                setItinerary(prev => {
                    const changedItem = prev.find(i => i.id === itemId);
                    
                    if (changedItem.syncGroup) {
                        return prev.map(item => 
                            item.syncGroup === changedItem.syncGroup ? { ...item, selectedOption: optionId } : item
                        );
                    }
                    
                    return prev.map(item => item.id === itemId ? { ...item, selectedOption: optionId } : item);
                });
            };

            const toggleModal = (key) => {
                setModals(prev => ({ ...prev, [key]: !prev[key] }));
                if(key === 'plan' && !modals.plan) {
                    setNewPlanType('single');
                    setNewOptions([{ id: 'optA', label: '', cost: 0, desc: '' }]);
                }
            };

            const addMember = (e) => { e.preventDefault(); const n = e.target.name.value.trim(); if(n){ setMembers([...members, {id: Date.now(), name: n}]); e.target.reset(); }};
            const removeMember = (id) => setMembers(members.filter(m => m.id !== id));

            const handleAddOptionField = () => {
                const nextChar = String.fromCharCode(65 + newOptions.length);
                setNewOptions([...newOptions, { id: `opt${nextChar}`, label: '', cost: 0, desc: '' }]);
            };

            const handleOptionChange = (index, field, value) => {
                const updated = [...newOptions];
                updated[index][field] = value;
                setNewOptions(updated);
            };

            const removeOptionField = (index) => {
                if(newOptions.length > 1) {
                    const updated = newOptions.filter((_, i) => i !== index);
                    const reIndexed = updated.map((opt, i) => ({ ...opt, id: `opt${String.fromCharCode(65 + i)}` }));
                    setNewOptions(reIndexed);
                }
            };

            const submitNewPlan = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                
                const newItem = {
                    id: `custom_${Date.now()}`,
                    date: fd.get('date'),
                    time: fd.get('time'),
                    name: fd.get('name'),
                    desc: fd.get('desc'),
                };

                if (newPlanType === 'single') {
                    newItem.hasOptions = false;
                    newItem.cost = parseFloat(fd.get('cost') || 0);
                } else {
                    newItem.hasOptions = true;
                    newItem.selectedOption = 'optA';
                    newItem.options = newOptions.filter(opt => opt.label.trim() !== '').map(opt => ({
                        ...opt, 
                        cost: parseFloat(opt.cost || 0),
                        label: opt.label || `Plan ${opt.id.replace('opt','')}`
                    }));
                    
                    if(newItem.options.length === 0) return alert('กรุณากรอกตัวเลือกอย่างน้อย 1 อัน');
                }

                setItinerary([...itinerary, newItem].sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time)));
                toggleModal('plan');
            };

            const removePlan = (id) => setItinerary(itinerary.filter(i => i.id !== id));

            // --- Calculations ---
            const totalCost = itinerary.reduce((sum, item) => {
                if (item.hasOptions) {
                    const opt = item.options.find(o => o.id === item.selectedOption);
                    return sum + (opt ? opt.cost : 0);
                }
                return sum + (item.cost || 0);
            }, 0);

            const costPerPerson = members.length > 0 ? totalCost / members.length : 0;

            const groupedItinerary = itinerary.reduce((acc, item) => {
                if (!acc[item.date]) acc[item.date] = [];
                acc[item.date].push(item);
                return acc;
            }, {});

            const formatDate = (dateStr) => new Date(dateStr).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });

            return (
                <div className="p-4 md:p-8 font-sans">

                            <div className="absolute top-0 right-0 p-6 opacity-20 transition-transform duration-700 group-hover:rotate-12 group-hover:scale-110"><i className="fa-solid fa-anchor text-8xl md:text-9xl text-indigo-400"></i></div>
                            <h1 className="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-700 to-indigo-700 mb-4 tracking-tight drop-shadow-sm relative z-10">🌴 ทริปล่มแน่นอน เกาะสีชัง 🌊</h1>
                            <p className="text-slate-700 font-semibold text-base md:text-lg relative z-10 bg-white/40 inline-block px-4 py-1 rounded-full shadow-sm backdrop-blur-sm">พิษณุโลก ➔ เกาะสีชัง ➔ พูลวิลล่า (24-26 ต.ค. กูมั่ววัน)</p>
                        </div>

                            {/* Left Column */}
                            <div className="lg:col-span-4 space-y-6">
                                <div className="glass-panel p-6 animate-slide-up hover:border-white/80 hover:shadow-lg transition-all" style={{animationDelay: '0.1s'}}>
                                    <div className="flex justify-between items-center mb-6 pb-4 border-b border-white/40">
                                        <h2 className="text-xl font-bold text-slate-800"><i className="fa-solid fa-users text-blue-500 mr-2"></i> สมาชิก ({members.length})</h2>
                                        <button onClick={()=>toggleModal('members')} className="glass-card hover:bg-white text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-sm hover:shadow-md"><i className="fa-solid fa-pen"></i> แก้ไข</button>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {members.map(m => (
                                            <span key={m.id} className="glass-card px-4 py-2 rounded-full text-slate-800 font-medium text-sm border-white/60 shadow-sm">{m.name}</span>

                                    </div>
                                </div>
                            </div>

                            {/* Right Column */}
                            <div className="lg:col-span-8 glass-panel p-4 md:p-8 animate-slide-up hover:border-white/80 hover:shadow-lg transition-all" style={{animationDelay: '0.15s'}}>
                                <div className="flex justify-between items-center mb-8 pb-4 border-b border-white/40">
                                    <h2 className="text-2xl font-bold text-slate-800"><i className="fa-solid fa-map-location-dot text-indigo-500 mr-3"></i> แพลน & ค่าใช้จ่าย</h2>
                                    <button onClick={()=>toggleModal('plan')} className="bg-indigo-600/90 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-lg shadow-indigo-200 transition-all hover:-translate-y-1"><i className="fa-solid fa-plus mr-1"></i> เพิ่มแพลน</button>
                                </div>

                                <div className="space-y-12">
                                    {Object.keys(groupedItinerary).map(date => (
                                        <div key={date}>
                                            <h3 className="inline-flex items-center bg-slate-800/90 backdrop-blur-md text-white px-5 py-2.5 rounded-full text-sm font-bold mb-8 shadow-md">
                                                <i className="fa-regular fa-calendar mr-2"></i>{formatDate(date)}
                                            </h3>
                                            
                                            <div className="border-l-[3px] border-indigo-200/60 ml-4 md:ml-5 pl-6 md:pl-8 space-y-10 relative">
                                                {groupedItinerary[date].map(item => (
                                                    <div key={item.id} className="relative group">
                                                        <div className="absolute -left-[35px] md:-left-[43px] top-1 w-5 h-5 bg-indigo-500 rounded-full border-[4px] border-[#f1f5f9] shadow-sm group-hover:scale-125 group-hover:bg-blue-400 transition-all duration-300"></div>
                                                        
                                                        <div className="flex flex-col md:flex-row md:justify-between md:items-start gap-2 mb-2">
                                                            <div className="pr-6">
                                                                <span className="font-extrabold text-indigo-600 mr-3">{item.time}</span>
                                                                <span className="text-lg font-bold text-slate-800">{item.name}</span>
                                                            </div>
                                                            <div className="flex items-center gap-3">
                                                                {!item.hasOptions && item.cost > 0 && (
                                                                    <span className="bg-emerald-100/90 text-emerald-800 px-3 py-1 rounded-lg text-sm font-bold border border-emerald-200 shadow-sm">฿{item.cost.toLocaleString()}</span>
                                                                )}
                                                                {item.id.toString().startsWith('custom_') && (
                                                                    <button onClick={() => removePlan(item.id)} className="text-red-400 hover:text-red-600 hover:bg-red-50 p-2 rounded-lg text-sm opacity-100 md:opacity-0 md:group-hover:opacity-100 transition-all"><i className="fa-solid fa-trash"></i></button>
                                                                )}
                                                            </div>
                                                        </div>
                                                        
                                                        {item.desc && <p className="text-slate-500 text-sm mb-4 leading-relaxed bg-white/30 inline-block px-3 py-1 rounded-lg">"{item.desc}"</p>}

                                                        {item.hasOptions && (
                                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">
                                                                {item.options.map(opt => {
                                                                    const isSelected = item.selectedOption === opt.id;
                                                                    return (
                                                                        <label key={opt.id} className="option-label">
                                                                            <input type="radio" name={`choice-${item.id}`} className="hidden option-input" 
                                                                                   checked={isSelected} onChange={() => handleOptionSelect(item.id, opt.id)} />
                                                                            <div className="glass-card p-4 transition-all duration-300 flex justify-between items-center h-full group/card hover:bg-white hover:border-indigo-300 border-white/60 shadow-sm hover:shadow-md">
                                                                                <div className="pr-3">
                                                                                    <div className={`font-bold ${isSelected ? 'text-blue-700' : 'text-slate-700'}`}>{opt.label}</div>
                                                                                    {opt.desc && <div className="text-xs text-slate-500 mt-1 leading-snug">{opt.desc}</div>}
                                                                                </div>
                                                                                <div className="text-right flex-shrink-0 flex flex-col items-end justify-center">
                                                                                    <div className={`font-bold ${isSelected ? 'text-emerald-600 text-lg' : 'text-slate-600'}`}>฿{opt.cost.toLocaleString()}</div>
                                                                                    <i className="fa-solid fa-circle-check text-blue-500 text-xl check-icon mt-1 drop-shadow-sm"></i>
                                                                                </div>
                                                                            </div>
                                                                        </label>
                                                                    )
                                                                })}
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* STICKY TOTAL BAR */}
                    <div className="sticky-summary animate-slide-up" style={{animationDelay: '0.3s'}}>
                        <div>
                            <div className="text-[10px] md:text-xs text-slate-300 font-medium uppercase tracking-wider mb-1">รวมค่าใช้จ่ายทริป</div>
                            <div className="text-2xl md:text-3xl font-extrabold tracking-tight">฿{totalCost.toLocaleString()}</div>
                        </div>
                        <div className="text-right border-l border-slate-600/50 pl-4 md:pl-5">
                            <div className="text-[10px] md:text-xs text-slate-300 font-medium uppercase tracking-wider mb-1">หาร {members.length} คน</div>
                            <div className="text-2xl md:text-3xl font-extrabold text-emerald-400 tracking-tight">฿{Math.ceil(costPerPerson).toLocaleString()}</div>
                        </div>
                    </div>

                    {/* MODAL: Members */}
                    {modals.members && (
                        <Modal title="จัดการสมาชิก" onClose={() => toggleModal('members')}>
                            <form onSubmit={addMember} className="flex gap-2 mb-6">
                                <input name="name" type="text" placeholder="ชื่อไอ่เหี้ยสักคน..." required className="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-400 bg-slate-50/50 focus:bg-white transition-colors shadow-inner" />
                                <button type="submit" className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold shadow-md hover:bg-indigo-700 hover:-translate-y-0.5 transition-all">เพิ่ม</button>
                            </form>
                            <div className="flex flex-col gap-2">
                                {members.map(m => (
                                    <div key={m.id} className="flex justify-between items-center bg-slate-50/70 p-3 px-4 rounded-xl border border-slate-200">
                                        <span className="font-semibold text-slate-700">{m.name}</span>
                                        <button onClick={() => removeMember(m.id)} className="text-red-400 hover:text-red-600 bg-white hover:bg-red-50 p-2 rounded-lg transition-colors shadow-sm"><i className="fa-solid fa-trash"></i></button>
                                    </div>
                                ))}
                            </div>
                        </Modal>
                    )}
                    
                    {/* MODAL: Plan CRUD */}
                    {modals.plan && (
                        <Modal title="เพิ่มแพลนยิบย่อย" onClose={() => toggleModal('plan')}>
                            <form onSubmit={submitNewPlan} className="flex flex-col gap-4">
                                <div className="flex gap-3">
                                    <div className="flex-1"><label className="text-xs font-semibold text-slate-500 mb-1 block">วันที่</label><input name="date" type="date" required defaultValue="2026-10-24" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-400 bg-slate-50/50" /></div>
                                    <div className="flex-1"><label className="text-xs font-semibold text-slate-500 mb-1 block">เวลา</label><input name="time" type="time" required className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-400 bg-slate-50/50" /></div>
                                </div>
                                <div><input name="name" type="text" placeholder="ชื่อกิจกรรม / สถานที่" required className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-400 bg-slate-50/50 font-semibold shadow-inner" /></div>
                                <div><input name="desc" type="text" placeholder="หมายเหตุ / คำด่า (ไม่บังคับ)" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-400 bg-slate-50/50 text-sm" /></div>

                                {/* Plan Type Switcher */}
                                <div className="bg-slate-100 p-1.5 rounded-xl flex gap-1 mt-2">
                                    <button type="button" onClick={()=>setNewPlanType('single')} className={`flex-1 py-2 rounded-lg text-sm font-semibold transition-all ${newPlanType === 'single' ? 'bg-white shadow text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}>ราคาเดียวตายตัว</button>
                                    <button type="button" onClick={()=>setNewPlanType('multiple')} className={`flex-1 py-2 rounded-lg text-sm font-semibold transition-all ${newPlanType === 'multiple' ? 'bg-white shadow text-indigo-600' : 'text-slate-500 hover:text-slate-700'}`}>มีหลายตัวเลือก (Plan A, B...)</button>
                                </div>

                                {/* Dynamic Fields based on Type */}
                                {newPlanType === 'single' ? (
                                    <div className="bg-slate-50/50 p-4 rounded-xl border-dashed border-2 border-slate-300 mt-2">
                                        <label className="text-xs font-semibold text-slate-500 mb-1 block">ค่าใช้จ่ายรวม (บาท)</label>
                                        <input name="cost" type="number" placeholder="ใส่ 0 ถ้าไม่มีค่าใช้จ่าย" defaultValue="0" className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-400 bg-white" />
                                    </div>
                                ) : (
                                    <div className="space-y-3 mt-2 bg-slate-50/80 p-4 rounded-xl border border-slate-200">
                                        <p className="text-xs font-semibold text-slate-500">กำหนดตัวเลือก (เพื่อเปรียบเทียบราคา)</p>
                                        {newOptions.map((opt, idx) => (
                                            <div key={idx} className="flex gap-2 items-start bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm relative group">
                                                <div className="flex-1 space-y-2.5">
                                                    <input type="text" placeholder={`ชื่อตัวเลือก (เช่น Plan ${String.fromCharCode(65 + idx)})`} value={opt.label} onChange={(e) => handleOptionChange(idx, 'label', e.target.value)} required className="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-400" />
                                                    <div className="flex gap-2">
                                                        <input type="number" placeholder="ราคา (บาท)" value={opt.cost || ''} onChange={(e) => handleOptionChange(idx, 'cost', e.target.value)} className="w-1/3 px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-400" />
                                                        <input type="text" placeholder="รายละเอียดเสริม" value={opt.desc} onChange={(e) => handleOptionChange(idx, 'desc', e.target.value)} className="flex-1 px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-400" />
                                                    </div>
                                                </div>
                                                {newOptions.length > 1 && (
                                                    <button type="button" onClick={() => removeOptionField(idx)} className="text-red-400 hover:text-red-600 bg-red-50 hover:bg-red-100 p-2 rounded-lg transition-colors"><i className="fa-solid fa-times"></i></button>
                                                )}
                                            </div>
                                        ))}
                                        <button type="button" onClick={handleAddOptionField} className="w-full py-2.5 mt-2 border-2 border-dashed border-indigo-300 text-indigo-600 rounded-xl text-sm font-semibold hover:bg-indigo-50 hover:border-indigo-400 transition-colors"><i className="fa-solid fa-plus mr-1"></i> เพิ่มตัวเลือกย่อย</button>
                                    </div>
                                )}

                                <button type="submit" className="bg-indigo-600 text-white px-6 py-3.5 rounded-xl font-bold mt-4 shadow-lg shadow-indigo-200 hover:bg-indigo-700 hover:-translate-y-0.5 transition-all text-lg">บันทึกข้อมูล</button>
                            </form>
                        </Modal>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
