<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌴 ทริปล่มจมเกาะล้าน (Dashboard) 🌊</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { glass: 'rgba(255, 255, 255, 0.4)', glassDark: 'rgba(255, 255, 255, 0.6)' }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #f0f4f8; color: #1f2937; overflow-x: hidden; }

        /* Liquid Glass Background */
        .glass-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; animation: moveBlobs 20s infinite alternate; }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #ff9a9e; }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #fecfef; animation-delay: -5s; }
        .blob-3 { top: 40%; left: 30%; width: 40vw; height: 40vw; background: #a1c4fd; animation-delay: -10s; }
        @keyframes moveBlobs { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-5vw, 10vh) scale(0.9); } }

        /* Glass Card */
        .glass-card { background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 24px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }

        /* Animations */
        @keyframes slideUpFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-enter { animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .delay-100 { animation-delay: 0.1s; } .delay-200 { animation-delay: 0.2s; }
        
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
        .modal-animate { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(139, 92, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); } }
        .active-seat { animation: pulseGlow 1.5s infinite; }

        /* Winding Path Timeline CSS */
        .wavy-timeline::before {
            content: ''; position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 8px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="200" viewBox="0 0 8 200"><path d="M4,0 C-10,50 18,150 4,200" fill="none" stroke="%23cbd5e1" stroke-width="4" stroke-dasharray="10,10" /></svg>') repeat-y;
            z-index: 0; opacity: 0.7;
        }

        /* Layout */
        .dashboard-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; flex-shrink: 0; }
        .main-content { flex-grow: 1; height: 100vh; overflow-y: auto; scroll-behavior: smooth; }
        
        @media (max-width: 768px) {
            .dashboard-layout { flex-direction: column; }
            .sidebar { width: 100%; position: fixed; bottom: 0; z-index: 40; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); }
            .main-content { height: calc(100vh - 70px); padding-bottom: 80px; }
            .wavy-timeline::before { left: 20px; }
        }
    </style>
</head>
<body>
    <div class="glass-bg"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- Mock Data ---
        const initialMembers = [
            { id: 1, name: 'บิว' }, { id: 2, name: 'ต้นหอม' }, { id: 3, name: 'เบส' },
            { id: 4, name: 'ที' }, { id: 5, name: 'ฟิว' }, { id: 6, name: 'เฟิร์ส' },
            { id: 7, name: 'แอ็ค' }, { id: 8, name: 'แฟนหอมในอนาคต' }, { id: 9, name: 'แฟนฟิว' },
            { id: 10, name: 'แฟนที' }
        ];

        const initialCars = [
            { id: 1, name: 'รถตู้ VIP ผีไม่หลอก', maxSeats: 8, occupants: {} },
            { id: 2, name: 'รถใครสักคน', maxSeats: 4, occupants: {} }
        ];

        const initialJourney = [
            { id: 1, date: '2026-08-12', time: '22:00', name: 'โลตัส พิษณุโลก (จุดรวมพล)', link: '', image: 'https://images.unsplash.com/photo-1542282088-fe8426682b8f?w=400&q=80' },
            { id: 2, date: '2026-08-13', time: '01:00', name: 'แวะพัก นครสวรรค์', link: '', image: 'https://images.unsplash.com/photo-1569429593410-b498b3fb3387?w=400&q=80' },
            { id: 3, date: '2026-08-13', time: '06:00', name: 'ท่าเรือแหลมบาลีฮาย', link: '', image: 'https://images.unsplash.com/photo-1588631189447-797bb4b77f92?w=400&q=80' }
        ];

        const initialItinerary = [
            { id: 1, date: '2026-08-13', time: '07:30', name: 'ขึ้นสปีดโบ๊ทไปเกาะล้าน', cost: 3000, link: '', image: 'https://images.unsplash.com/photo-1590523277543-a94d2e4eb00b?w=400&q=80' },
            { id: 2, date: '2026-08-13', time: '14:00', name: 'เช็คอินที่พัก', cost: 8500, link: '', image: 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400&q=80' },
            { id: 3, date: '2026-08-14', time: '18:00', name: 'ปาร์ตี้หมูกระทะริมทะเล', cost: 4000, link: '', image: 'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=400&q=80' }
        ];

        // --- Helper: Format Date ---
        const formatDate = (dateStr) => {
            if(!dateStr) return 'ไม่ระบุวัน';
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return new Date(dateStr).toLocaleDateString('th-TH', options);
        };

        // --- Helper: Group by Date ---
        const groupByDate = (items) => {
            return items.reduce((acc, item) => {
                const d = item.date || 'unknown';
                if (!acc[d]) acc[d] = [];
                acc[d].push(item);
                return acc;
            }, {});
        };

        // --- UI Components ---
        const Modal = ({ title, onClose, children }) => (
            <div className="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 animate-[popIn_0.2s_forwards]">
                <div className="bg-white/90 backdrop-blur-xl border border-white rounded-3xl p-6 w-full max-w-lg shadow-2xl modal-animate max-h-[90vh] overflow-y-auto">
                    <div className="flex justify-between items-center mb-4">
                        <h3 className="text-xl font-bold">{title}</h3>
                        <button onClick={onClose} className="text-gray-500 hover:text-red-500 text-3xl leading-none transition-transform hover:scale-110">&times;</button>
                    </div>
                    {children}
                </div>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('overview'); // overview, cars, route, plan
            
            // App States
            const [members, setMembers] = useState(initialMembers);
            const [cars, setCars] = useState(initialCars);
            const [journey, setJourney] = useState(initialJourney);
            const [itinerary, setItinerary] = useState(initialItinerary);

            // Modals
            const [modals, setModals] = useState({ members: false, cars: false, journey: false, itinerary: false });
            const toggleModal = (key) => setModals(prev => ({ ...prev, [key]: !prev[key] }));

            // Seating State
            const [activeMemberId, setActiveMemberId] = useState(null);

            // Handlers (Members)
            const addMember = (e) => { e.preventDefault(); const name = e.target.name.value.trim(); if (name) { setMembers([...members, { id: Date.now(), name }]); e.target.reset(); } };
            const removeMember = (id) => {
                setMembers(members.filter(m => m.id !== id));
                setCars(cars.map(car => {
                    const newOcc = { ...car.occupants };
                    Object.keys(newOcc).forEach(k => { if (newOcc[k] === id) delete newOcc[k]; });
                    return { ...car, occupants: newOcc };
                }));
            };

            // Handlers (Seating)
            const handlePoolClick = (memberId) => setActiveMemberId(activeMemberId === memberId ? null : memberId);
            const handleSeatClick = (carId, seatIndex) => {
                const carIndex = cars.findIndex(c => c.id === carId);
                const car = cars[carIndex];
                const newCars = [...cars];
                const newOccupants = { ...car.occupants };

                if (activeMemberId) {
                    newCars.forEach(c => { Object.keys(c.occupants).forEach(k => { if (c.occupants[k] === activeMemberId) delete c.occupants[k]; }); });
                    newOccupants[seatIndex] = activeMemberId;
                    newCars[carIndex].occupants = newOccupants;
                    setCars(newCars);
                    setActiveMemberId(null);
                } else if (car.occupants[seatIndex]) {
                    delete newOccupants[seatIndex];
                    newCars[carIndex].occupants = newOccupants;
                    setCars(newCars);
                }
            };

            const seatedMemberIds = useMemo(() => {
                const ids = new Set();
                cars.forEach(car => Object.values(car.occupants).forEach(id => ids.add(id)));
                return ids;
            }, [cars]);
            const unseatedMembers = members.filter(m => !seatedMemberIds.has(m.id));

            // Handlers (CRUD Data)
            const addCar = (e) => { e.preventDefault(); const n = e.target.name.value; const s = parseInt(e.target.seats.value); if (n && s) setCars([...cars, { id: Date.now(), name: n, maxSeats: s, occupants: {} }]); e.target.reset(); };
            const removeCar = (id) => setCars(cars.filter(c => c.id !== id));

            const addJourney = (e) => { e.preventDefault(); const fd = new FormData(e.target); setJourney([...journey, { id: Date.now(), date: fd.get('date'), time: fd.get('time'), name: fd.get('name'), link: fd.get('link'), image: fd.get('image') }].sort((a,b)=>a.date.localeCompare(b.date) || a.time.localeCompare(b.time))); e.target.reset(); };
            const removeJourney = (id) => setJourney(journey.filter(j => j.id !== id));

            const addItinerary = (e) => { e.preventDefault(); const fd = new FormData(e.target); setItinerary([...itinerary, { id: Date.now(), date: fd.get('date'), time: fd.get('time'), name: fd.get('name'), cost: parseFloat(fd.get('cost')||0), link: fd.get('link'), image: fd.get('image') }].sort((a,b)=>a.date.localeCompare(b.date) || a.time.localeCompare(b.time))); e.target.reset(); };
            const removeItinerary = (id) => setItinerary(itinerary.filter(i => i.id !== id));

            const totalCost = itinerary.reduce((sum, item) => sum + (item.cost || 0), 0);

            // --- Render Functions for Tabs ---
            const renderOverview = () => (
                <div className="animate-enter opacity-0 space-y-6">
                    <div className="glass-card p-10 text-center relative overflow-hidden group mb-8">
                        <h1 className="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-violet-500 mb-4 transition-transform hover:scale-105 duration-300">🌴 ทริปล่มจมเกาะล้าน 🌊</h1>
                        <p className="text-lg text-gray-700 font-medium">พิษณุโลก ➔ ชลบุรี ➔ เกาะล้าน</p>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {/* Stats Cards */}
                        <div className="glass-card p-6 flex flex-col items-center justify-center hover:scale-105 transition-transform cursor-pointer" onClick={() => setActiveTab('cars')}>
                            <i className="fa-solid fa-users text-4xl text-pink-500 mb-3"></i>
                            <h3 className="text-gray-500 font-medium">สมาชิกทั้งหมด</h3>
                            <p className="text-3xl font-bold text-gray-800">{members.length} <span className="text-lg font-normal">คน</span></p>
                        </div>
                        <div className="glass-card p-6 flex flex-col items-center justify-center bg-gradient-to-br from-green-400/20 to-teal-500/20">
                            <i className="fa-solid fa-sack-dollar text-4xl text-green-500 mb-3"></i>
                            <h3 className="text-gray-500 font-medium">งบกองกลาง (รวม)</h3>
                            <p className="text-3xl font-bold text-gray-800">฿{totalCost.toLocaleString()}</p>
                            <p className="text-sm text-green-600 mt-1">หารแล้วคนละ ฿{members.length ? Math.ceil(totalCost/members.length).toLocaleString() : 0}</p>
                        </div>
                        <div className="glass-card p-6 flex flex-col items-center justify-center hover:scale-105 transition-transform cursor-pointer" onClick={() => setActiveTab('cars')}>
                            <i className="fa-solid fa-car text-4xl text-blue-500 mb-3"></i>
                            <h3 className="text-gray-500 font-medium">รถยนต์</h3>
                            <p className="text-3xl font-bold text-gray-800">{cars.length} <span className="text-lg font-normal">คัน</span></p>
                            <p className="text-sm text-blue-600 mt-1">ที่นั่งว่าง: {cars.reduce((acc, c) => acc + c.maxSeats, 0) - seatedMemberIds.size}</p>
                        </div>
                    </div>
                </div>
            );

            const renderCars = () => (
                <div className="animate-enter opacity-0 delay-100 space-y-6">
                    {/* Members Area */}
                    <div className="glass-card p-6">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-xl font-bold text-gray-800"><i className="fa-solid fa-user-group text-pink-500 mr-2"></i> สมาชิกแก๊ง</h2>
                            <button onClick={() => toggleModal('members')} className="bg-white/50 hover:bg-white text-gray-800 px-4 py-2 rounded-xl shadow-sm transition-all text-sm font-medium hover:scale-105"><i className="fa-solid fa-plus mr-1"></i> เพิ่ม/ลด</button>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            {members.map(m => (
                                <span key={m.id} className="px-3 py-1 bg-white/60 border border-white/50 rounded-full shadow-sm text-gray-800 text-sm animate-[popIn_0.3s]">{m.name}</span>
                            ))}
                        </div>
                    </div>

                    {/* Cars Area */}
                    <div className="glass-card p-6">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-bold text-gray-800"><i className="fa-solid fa-car text-violet-500 mr-2"></i> จัดที่นั่งการเดินทาง</h2>
                            <button onClick={() => toggleModal('cars')} className="bg-white/50 hover:bg-white text-gray-800 px-4 py-2 rounded-xl shadow-sm transition-all text-sm font-medium hover:scale-105"><i className="fa-solid fa-plus mr-1"></i> เพิ่มรถ</button>
                        </div>
                        
                        <div className="mb-6 p-4 bg-white/30 rounded-2xl border border-white/40 min-h-[80px]">
                            <h3 className="text-sm font-semibold text-gray-700 mb-3">แตะชื่อคน แล้วแตะเบาะรถเพื่อวาง 📌:</h3>
                            <div className="flex flex-wrap gap-2">
                                {unseatedMembers.map(m => (
                                    <button key={m.id} onClick={() => handlePoolClick(m.id)}
                                        className={`px-4 py-2 rounded-full font-medium transition-all duration-300 border ${activeMemberId === m.id ? 'bg-violet-500 text-white border-violet-600 shadow-lg transform scale-110 active-seat' : 'bg-white/70 text-gray-800 border-white hover:bg-white hover:scale-105'}`}>
                                        {m.name} {activeMemberId === m.id && <i className="fa-solid fa-hand-pointer ml-2 animate-bounce"></i>}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {cars.map(car => (
                                <div key={car.id} className="bg-white/40 rounded-2xl p-5 border border-white/50 shadow-sm transition-all hover:bg-white/50">
                                    <div className="text-lg font-bold text-gray-800 mb-4 border-b border-gray-300/50 pb-2 text-center">
                                        🚙 {car.name} <span className="text-sm font-normal text-gray-500">({Object.keys(car.occupants).length}/{car.maxSeats})</span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3 justify-items-center">
                                        {Array.from({length: car.maxSeats}).map((_, idx) => {
                                            const occupant = members.find(m => m.id === car.occupants[idx]);
                                            return (
                                                <button key={idx} onClick={() => handleSeatClick(car.id, idx)}
                                                    className={`w-full max-w-[100px] h-14 rounded-xl flex items-center justify-center font-medium border-2 transition-all duration-300 ${occupant ? 'bg-gradient-to-br from-pink-200 to-pink-300 border-pink-400 text-pink-900 shadow-md transform scale-100 hover:scale-95' : 'bg-black/5 border-dashed border-gray-400/50 text-gray-400 hover:bg-black/10 hover:border-violet-400'} ${activeMemberId && !occupant ? 'animate-pulse bg-violet-100/50 border-violet-300' : ''}`}>
                                                    {occupant ? occupant.name : <i className="fa-solid fa-chair text-xl opacity-50"></i>}
                                                </button>
                                            )
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            // Timeline Renderer for Journey and Itinerary
            const renderTimeline = (data, icon, colorClass, type) => {
                const groupedData = groupByDate(data);
                return (
                    <div className="animate-enter opacity-0 space-y-6 pb-20">
                        <div className="flex justify-between items-center bg-white/50 p-4 rounded-2xl backdrop-blur-md">
                            <h2 className={`text-2xl font-bold ${colorClass}`}><i className={`fa-solid ${icon} mr-2`}></i> {type === 'journey' ? 'เส้นทางการเดินทาง' : 'แพลนท่องเที่ยว'}</h2>
                            <button onClick={() => toggleModal(type)} className="bg-white hover:bg-gray-50 px-4 py-2 rounded-xl shadow-sm transition-all font-medium hover:scale-105"><i className="fa-solid fa-pen mr-1"></i> แก้ไข</button>
                        </div>

                        <div className="relative wavy-timeline mt-8 px-4 md:px-0">
                            {/* Sticky Icon follows scroll */}
                            <div className="sticky top-1/2 left-0 md:left-1/2 transform md:-translate-x-1/2 -translate-y-1/2 z-20 w-8 h-8 pointer-events-none hidden md:flex justify-center transition-all duration-500">
                                <div className={`bg-white shadow-xl border-4 rounded-full w-12 h-12 flex items-center justify-center text-xl animate-bounce ${colorClass.replace('text-', 'border-').replace('600', '400')} ${colorClass}`}>
                                    <i className={`fa-solid ${icon}`}></i>
                                </div>
                            </div>

                            {Object.keys(groupedData).map((dateKey, dateIndex) => (
                                <div key={dateKey} className="mb-12 relative z-10">
                                    {/* Date Header */}
                                    <div className="flex justify-center mb-8">
                                        <span className={`px-6 py-2 rounded-full font-bold shadow-md text-white ${type === 'journey' ? 'bg-blue-500' : 'bg-orange-500'}`}>
                                            <i className="fa-regular fa-calendar mr-2"></i>{formatDate(dateKey)}
                                        </span>
                                    </div>
                                    
                                    <div className="flex flex-col gap-10">
                                        {groupedData[dateKey].map((item, index) => {
                                            const isLeft = index % 2 === 0;
                                            return (
                                                <div key={item.id} className={`flex flex-col md:flex-row w-full ${isLeft ? 'md:justify-start pl-8 md:pl-0' : 'md:justify-end pl-8 md:pl-0'} items-center group`}>
                                                    
                                                    {/* Mobile dot indicator */}
                                                    <div className={`md:hidden absolute left-[16px] w-4 h-4 rounded-full border-2 bg-white z-20 ${colorClass.replace('text-', 'border-')}`}></div>

                                                    <div className={`w-full md:w-[45%] p-5 bg-white/80 backdrop-blur-md rounded-2xl shadow-sm border-2 border-transparent transition-all duration-300 hover:-translate-y-2 hover:shadow-xl ${isLeft ? 'md:mr-8 hover:border-l-blue-400' : 'md:ml-8 hover:border-r-orange-400'}`}>
                                                        <div className="flex justify-between items-center mb-2">
                                                            <div className={`font-bold text-lg flex items-center gap-2 ${colorClass}`}>
                                                                <i className="fa-regular fa-clock"></i> {item.time}
                                                            </div>
                                                            {item.cost > 0 && <span className="bg-green-100 text-green-700 px-3 py-1 rounded-lg text-sm font-bold border border-green-200">฿{item.cost.toLocaleString()}</span>}
                                                        </div>
                                                        <h4 className="text-xl font-bold text-gray-800 mb-3">{item.name}</h4>
                                                        
                                                        {item.image && (
                                                            <div className="w-full h-48 rounded-xl overflow-hidden mb-3 shadow-inner">
                                                                <img src={item.image} alt={item.name} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                                                            </div>
                                                        )}
                                                        {item.link && (
                                                            <a href={item.link} target="_blank" className="text-sm bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-lg text-gray-700 transition-colors inline-flex items-center gap-2">
                                                                <i className="fa-solid fa-map-location-dot text-blue-500"></i> เปิด Google Maps
                                                            </a>
                                                        )}
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                )
            };

            // --- Form Inputs Reusable ---
            const renderTimelineForm = (onSubmit, type) => (
                <form onSubmit={onSubmit} className="flex flex-col gap-3 mb-6 bg-gray-50/50 p-4 rounded-2xl border border-gray-200">
                    <div className="flex gap-2">
                        <input name="date" type="date" required defaultValue="2026-08-12" className="w-1/2 px-4 py-2 rounded-xl border border-gray-300 focus:outline-none bg-white/90" />
                        <input name="time" type="time" required className="w-1/2 px-4 py-2 rounded-xl border border-gray-300 focus:outline-none bg-white/90" />
                    </div>
                    <input name="name" type="text" placeholder="ชื่อสถานที่ / กิจกรรม" required className="px-4 py-2 rounded-xl border border-gray-300 focus:outline-none bg-white/90" />
                    {type === 'itinerary' && <input name="cost" type="number" placeholder="ค่าใช้จ่ายรวม (บาท) ใส่ 0 หากไม่มี" defaultValue="0" className="px-4 py-2 rounded-xl border border-gray-300 focus:outline-none bg-white/90" />}
                    <input name="link" type="url" placeholder="Google Maps Link (ไม่บังคับ)" className="px-4 py-2 rounded-xl border border-gray-300 focus:outline-none bg-white/90 text-sm" />
                    <input name="image" type="url" placeholder="URL รูปภาพ (คลิกขวา Copy Image Address)" className="px-4 py-2 rounded-xl border border-gray-300 focus:outline-none bg-white/90 text-sm" />
                    <button type="submit" className={`text-white px-6 py-2 rounded-xl font-bold shadow-md transition-transform hover:scale-105 ${type==='journey' ? 'bg-blue-500 hover:bg-blue-600' : 'bg-orange-500 hover:bg-orange-600'}`}>เพิ่มข้อมูล</button>
                </form>
            );

            return (
                <div className="dashboard-layout">
                    {/* Sidebar Nav */}
                    <nav className="sidebar bg-white/60 backdrop-blur-xl border-r border-white/50 p-6 flex flex-col md:h-screen sticky top-0 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
                        <div className="hidden md:block text-center mb-10">
                            <div className="w-20 h-20 bg-gradient-to-tr from-pink-400 to-violet-500 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl shadow-lg animate-bounce">🏖️</div>
                            <h2 className="font-bold text-gray-800 text-lg">Trip Dashboard</h2>
                        </div>
                        
                        <div className="flex md:flex-col justify-around md:justify-start gap-2 md:gap-4 flex-1">
                            {[
                                { id: 'overview', icon: 'fa-chart-pie', label: 'ภาพรวม' },
                                { id: 'cars', icon: 'fa-car-side', label: 'สมาชิก & รถ' },
                                { id: 'journey', icon: 'fa-route', label: 'เส้นทาง' },
                                { id: 'itinerary', icon: 'fa-umbrella-beach', label: 'แพลนเที่ยว' }
                            ].map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                                    className={`flex flex-col md:flex-row items-center md:justify-start p-3 md:px-5 md:py-3 rounded-2xl transition-all duration-300 ${activeTab === tab.id ? 'bg-white shadow-md text-violet-600 scale-105' : 'text-gray-500 hover:bg-white/50 hover:text-gray-800'}`}>
                                    <i className={`fa-solid ${tab.icon} text-xl md:text-lg md:mr-3 mb-1 md:mb-0`}></i>
                                    <span className="text-xs md:text-base font-semibold">{tab.label}</span>
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    <main className="main-content p-4 md:p-10 relative">
                        <div className="max-w-4xl mx-auto">
                            {activeTab === 'overview' && renderOverview()}
                            {activeTab === 'cars' && renderCars()}
                            {activeTab === 'journey' && renderTimeline(journey, 'fa-car', 'text-blue-600', 'journey')}
                            {activeTab === 'itinerary' && renderTimeline(itinerary, 'fa-people-group', 'text-orange-600', 'itinerary')}
                        </div>
                    </main>

                    {/* Modals Data Management */}
                    {modals.members && (
                        <Modal title="จัดการสมาชิก" onClose={() => toggleModal('members')}>
                            <form onSubmit={addMember} className="flex gap-2 mb-6"><input name="name" type="text" placeholder="ชื่อสมาชิก..." required className="flex-1 px-4 py-2 rounded-xl border border-gray-300 focus:outline-none bg-gray-50" /><button type="submit" className="bg-pink-500 text-white px-4 py-2 rounded-xl font-medium hover:bg-pink-600">เพิ่ม</button></form>
                            <div className="flex flex-col gap-2 max-h-60 overflow-y-auto">{members.map(m => (<div key={m.id} className="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-200"><span className="font-medium">{m.name}</span><button onClick={() => removeMember(m.id)} className="text-red-400 hover:text-red-600 p-2"><i className="fa-solid fa-trash"></i></button></div>))}</div>
                        </Modal>
                    )}
                    {modals.cars && (
                        <Modal title="จัดการรถยนต์" onClose={() => toggleModal('cars')}>
                            <form onSubmit={addCar} className="flex flex-col gap-3 mb-6 bg-gray-50 p-4 rounded-2xl"><input name="name" type="text" placeholder="ชื่อรถ" required className="px-4 py-2 rounded-xl border border-gray-300 focus:outline-none" /><div className="flex gap-2"><input name="seats" type="number" min="1" placeholder="จำนวนที่นั่ง" required className="flex-1 px-4 py-2 rounded-xl border border-gray-300 focus:outline-none" /><button type="submit" className="bg-violet-500 text-white px-6 py-2 rounded-xl font-medium">เพิ่มรถ</button></div></form>
                            <div className="flex flex-col gap-2 max-h-60 overflow-y-auto">{cars.map(c => (<div key={c.id} className="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-200"><div><span className="font-bold block">{c.name}</span><span className="text-sm text-gray-500">{c.maxSeats} ที่นั่ง</span></div><button onClick={() => removeCar(c.id)} className="text-red-400 hover:text-red-600 p-2"><i className="fa-solid fa-trash"></i></button></div>))}</div>
                        </Modal>
                    )}
                    {modals.journey && (
                        <Modal title="จัดการเส้นทาง" onClose={() => toggleModal('journey')}>
                            {renderTimelineForm(addJourney, 'journey')}
                            <div className="flex flex-col gap-2 max-h-60 overflow-y-auto">{journey.map(j => (<div key={j.id} className="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-200"><div><span className="font-bold text-blue-600 mr-2">{j.time}</span><span className="font-medium">{j.name}</span> <span className="text-xs text-gray-500 block">{formatDate(j.date)}</span></div><button onClick={() => removeJourney(j.id)} className="text-red-400 hover:text-red-600 p-2"><i className="fa-solid fa-trash"></i></button></div>))}</div>
                        </Modal>
                    )}
                    {modals.itinerary && (
                        <Modal title="จัดการแพลนเที่ยว" onClose={() => toggleModal('itinerary')}>
                            {renderTimelineForm(addItinerary, 'itinerary')}
                            <div className="flex flex-col gap-2 max-h-60 overflow-y-auto">{itinerary.map(i => (<div key={i.id} className="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-200"><div><span className="font-bold text-orange-600 mr-2">{i.time}</span><span className="font-medium">{i.name}</span> <span className="text-xs text-gray-500 block">{formatDate(i.date)}</span></div><button onClick={() => removeItinerary(i.id)} className="text-red-400 hover:text-red-600 p-2"><i className="fa-solid fa-trash"></i></button></div>))}</div>
                        </Modal>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
