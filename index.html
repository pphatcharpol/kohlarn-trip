<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌴 ทริปเดือดเกาะสีชัง 🌊</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { glass: 'rgba(255, 255, 255, 0.45)' }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <style>
        body { background-color: #e2e8f0; color: #1e293b; }
        
        /* Background Animated Waves */
        .bg-waves {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }

        /* Animations */
        @keyframes pop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Sticky Floating Bar for Total Cost */
        .sticky-summary {
            position: sticky; bottom: 20px; z-index: 40;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); color: white;
            border-radius: 999px; padding: 15px 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex; justify-content: space-between; align-items: center;
        }

        /* Option Card Checkbox hidden */
        .option-input:checked + .option-card {
            border-color: #3b82f6; background-color: #eff6ff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2); transform: translateY(-2px);
        }
        .option-input:checked + .option-card .check-icon { display: block; }
    </style>
</head>
<body>
    <div class="bg-waves"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- MOCK DATA ตามแพลนที่ให้มา ---
        const initialMembers = [
            { id: 1, name: 'มึง 1' }, { id: 2, name: 'มึง 2' }, { id: 3, name: 'มึง 3' }, { id: 4, name: 'มึง 4' },
            { id: 5, name: 'มึง 5' }, { id: 6, name: 'มึง 6' }, { id: 7, name: 'มึง 7' }, { id: 8, name: 'มึง 8' }
        ];

        const initialItinerary = [
            {
                id: 1, date: '2026-10-24', time: '05:00',
                name: 'การเดินทางจากพิษณุโลก ➔ ท่าเรือเกาะลอย',
                desc: 'ระหว่างทางจะกินข้าวเช้าข้าวเที่ยงเหี้ยอะไรก็เรื่องของพ่อมึงมีปากก็พูดสิไอ่สัส',
                hasOptions: true,
                selectedOption: 'optA',
                options: [
                    { id: 'optA', label: 'Plan A: ขับรถส่วนตัว', cost: 3100, desc: 'น้ำมันไปกลับ 2,600 + ที่จอดรถ 500 (2คัน)' },
                    { id: 'optB', label: 'Plan B: นั่งรถไฟ', cost: 460, desc: 'ไปเจอหัวลำโพง ขบวน 283 (260฿) + ต่อสองแถว (200฿)' }
                ]
            },
            {
                id: 2, date: '2026-10-24', time: '13:00',
                name: 'เรือข้ามฟากไปเกาะสีชัง',
                desc: '',
                hasOptions: true,
                selectedOption: 'optA',
                options: [
                    { id: 'optA', label: 'เรือธรรมดา (40 นาที)', cost: 480, desc: '60 บาท * 8 คน' },
                    { id: 'optB', label: 'เรือเฟอร์รี่ แสงประทีป (15 นาที)', cost: 2100, desc: 'เหมาลำ' }
                ]
            },
            {
                id: 3, date: '2026-10-24', time: '14:00',
                name: 'เข้าที่พักเกาะสีชัง (นอนโง่ๆ อยู่ห้องบ้าง เหนื่อยไอ่สัส)',
                desc: 'หารถเข้าที่พัก (หาร 4 ห้อง)',
                hasOptions: true,
                selectedOption: 'optA',
                options: [
                    { id: 'optA', label: 'เกาะสีชังอันซีน / ปารีฮัท', cost: 10000, desc: '2,500/ห้อง' },
                    { id: 'optB', label: 'โนโวเทล / ชาวบ้านชาวเล', cost: 12000, desc: '3,000/ห้อง' }
                ]
            },
            { id: 4, date: '2026-10-24', time: '14:45', name: 'คาเฟ่เรือนซาร์เลวิช', desc: 'ถ่ายรูปสะพานอัษฎางค์', hasOptions: false, cost: 2080 }, // 260*8
            { id: 5, date: '2026-10-24', time: '15:00', name: 'ไหว้พระศาลเจ้าพ่อเขาใหญ่', desc: '', hasOptions: false, cost: 800 }, // 100*8
            { id: 6, date: '2026-10-24', time: '16:30', name: 'เล่นน้ำหาดถ้ำพัง', desc: '', hasOptions: false, cost: 0 },
            {
                id: 7, date: '2026-10-24', time: '18:00',
                name: 'กินข้าวเย็นบ้าง แดกแต่หญ้า',
                desc: '',
                hasOptions: true,
                selectedOption: 'optA',
                options: [
                    { id: 'optA', label: 'ร้านชาวบ้านชาวเล', cost: 2600, desc: 'กลางๆ ติดหวาน' },
                    { id: 'optB', label: 'ร้านชมตะวัน', cost: 2600, desc: 'ได้มิชลิน' }
                ]
            },
            {
                id: 8, date: '2026-10-24', time: '20:30',
                name: 'บาร์ หรือ เบียร์?',
                desc: 'มีทางเลือก ระหว่างแดกบาร์ กับแดกเบียร์',
                hasOptions: true,
                selectedOption: 'optA',
                options: [
                    { id: 'optA', label: 'บาร์ (เอาฟีล)', cost: 600, desc: '' },
                    { id: 'optB', label: 'เบียร์ (เอาฟุบ)', cost: 2000, desc: '' }
                ]
            },
            { id: 9, date: '2026-10-25', time: '07:00', name: 'เดินตลาด - ถ่ายรูป', desc: 'ตื่นเช้าถ้ามีปัญญา (ถ้าตอแหลหน่อยจะเล่นน้ำก็เรื่องของมึง)', hasOptions: false, cost: 0 },
            { id: 10, date: '2026-10-25', time: '08:30', name: 'ข้าวเช้า (ถ้าตื่น)', desc: 'พนันว่าถ้าไม่ตื่นมีก็ไม่แดกกันแน่นอน กลับมาเช็คเอาท์ก่อนเที่ยง', hasOptions: false, cost: 0 },
            {
                id: 11, date: '2026-10-25', time: '13:00',
                name: 'เรือข้ามฟากกลับฝั่ง',
                desc: '',
                hasOptions: true,
                selectedOption: 'optA',
                options: [
                    { id: 'optA', label: 'เรือธรรมดา (40 นาที)', cost: 480, desc: '' },
                    { id: 'optB', label: 'เรือเฟอร์รี่ เหมา (15 นาที)', cost: 2100, desc: '' }
                ]
            },
            { id: 12, date: '2026-10-25', time: '14:00', name: 'เข้า Pool Villa ชลบุรี', desc: 'ยังไม่มีแคนดิเดทที่พัก (ตีงบไว้ก่อน)', hasOptions: false, cost: 6800 },
            { id: 13, date: '2026-10-25', time: '15:00', name: 'ฟรีสไตล์', desc: 'คาเฟ่ชลบุรี/บางแสน/เดินห้าง เรื่องของท่าน', hasOptions: false, cost: 0 },
            { id: 14, date: '2026-10-25', time: '18:00', name: 'มื้อใหญ่กับเพื่อนก่อนกลับ', desc: '', hasOptions: false, cost: 2600 },
            { id: 15, date: '2026-10-26', time: '10:30', name: 'หาอะไรกินแล้วก็กลับได้แล้วไอ่เหี้ย', desc: 'ตอนกลับเหมือนกับขามา', hasOptions: false, cost: 0 }
        ];

        // --- Helper Components ---
        const Modal = ({ title, onClose, children }) => (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl p-6 w-full max-w-lg shadow-2xl animate-pop max-h-[90vh] overflow-y-auto">
                    <div className="flex justify-between items-center mb-4 border-b pb-2">
                        <h3 className="text-xl font-bold text-slate-800">{title}</h3>
                        <button onClick={onClose} className="text-slate-400 hover:text-red-500 text-2xl">&times;</button>
                    </div>
                    {children}
                </div>
            </div>
        );

        const App = () => {
            const [members, setMembers] = useState(initialMembers);
            const [itinerary, setItinerary] = useState(initialItinerary);
            const [modals, setModals] = useState({ members: false, plan: false });

            // --- Handlers ---
            const handleOptionSelect = (itemId, optionId) => {
                setItinerary(prev => prev.map(item => item.id === itemId ? { ...item, selectedOption: optionId } : item));
            };

            const toggleModal = (key) => setModals(prev => ({ ...prev, [key]: !prev[key] }));

            // CRUD Members
            const addMember = (e) => { e.preventDefault(); const n = e.target.name.value; if(n){ setMembers([...members, {id: Date.now(), name: n}]); e.target.reset(); }};
            const removeMember = (id) => setMembers(members.filter(m => m.id !== id));

            // CRUD Plan (Simple fixed cost add for now)
            const addPlan = (e) => { 
                e.preventDefault(); const fd = new FormData(e.target);
                setItinerary([...itinerary, { 
                    id: Date.now(), date: fd.get('date'), time: fd.get('time'), name: fd.get('name'), desc: fd.get('desc'),
                    hasOptions: false, cost: parseFloat(fd.get('cost')||0)
                }].sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time)));
                e.target.reset();
            };
            const removePlan = (id) => setItinerary(itinerary.filter(i => i.id !== id));

            // --- Calculations ---
            const totalCost = itinerary.reduce((sum, item) => {
                if (item.hasOptions) {
                    const opt = item.options.find(o => o.id === item.selectedOption);
                    return sum + (opt ? opt.cost : 0);
                }
                return sum + (item.cost || 0);
            }, 0);

            const costPerPerson = members.length > 0 ? totalCost / members.length : 0;

            // Grouping by Date
            const groupedItinerary = itinerary.reduce((acc, item) => {
                if (!acc[item.date]) acc[item.date] = [];
                acc[item.date].push(item);
                return acc;
            }, {});

            const formatDate = (dateStr) => new Date(dateStr).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });

            return (
                <div className="min-h-screen p-4 md:p-8 font-sans pb-32">
                    <div className="max-w-6xl mx-auto space-y-6">
                        
                        {/* Header Block */}
                        <div className="glass-panel p-8 text-center animate-pop">
                            <h1 className="text-4xl md:text-5xl font-extrabold text-slate-800 mb-2">🌴 ทริปเดือดเกาะสีชัง 🌊</h1>
                            <p className="text-slate-600 font-medium">พิษณุโลก ➔ เกาะสีชัง ➔ พูลวิลล่าชลบุรี (24-26 ต.ค. 2026)</p>
                        </div>

                        {/* Grid Layout (Members on Left, Timeline on Right for Desktop) */}
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                            
                            {/* Left Column: Members */}
                            <div className="lg:col-span-4 space-y-6">
                                <div className="glass-panel p-6 animate-pop" style={{animationDelay: '0.1s'}}>
                                    <div className="flex justify-between items-center mb-4 border-b border-slate-200 pb-3">
                                        <h2 className="text-xl font-bold text-slate-800"><i className="fa-solid fa-users text-blue-500 mr-2"></i> สมาชิก ({members.length} คน)</h2>
                                        <button onClick={()=>toggleModal('members')} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded-lg text-sm font-medium"><i className="fa-solid fa-pen"></i> แก้ไข</button>
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {members.map(m => (
                                            <span key={m.id} className="bg-white border border-slate-200 px-4 py-2 rounded-full text-slate-700 font-medium shadow-sm">{m.name}</span>
                                        ))}
                                    </div>
                                </div>

                                <div className="glass-panel p-6 bg-gradient-to-br from-blue-50 to-indigo-50 border-blue-100 animate-pop" style={{animationDelay: '0.2s'}}>
                                    <h3 className="text-slate-500 font-medium mb-1">💡 คำแนะนำการใช้งาน</h3>
                                    <p className="text-sm text-slate-600">ในแพลนด้านขวา จะมีกล่องตัวเลือก <b>Plan A / B</b> ให้กดแตะเพื่อเปลี่ยนตัวเลือกได้เลย ยอดเงินรวมด้านล่างจะเปลี่ยนตามทันที!</p>
                                </div>
                            </div>

                            {/* Right Column: Interactive Itinerary */}
                            <div className="lg:col-span-8 glass-panel p-4 md:p-8 animate-pop" style={{animationDelay: '0.15s'}}>
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-bold text-slate-800"><i className="fa-solid fa-map-location-dot text-indigo-500 mr-2"></i> แพลน & ค่าใช้จ่าย</h2>
                                    <button onClick={()=>toggleModal('plan')} className="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm"><i className="fa-solid fa-plus"></i> เพิ่มแพลน</button>
                                </div>

                                <div className="space-y-10">
                                    {Object.keys(groupedItinerary).map(date => (
                                        <div key={date}>
                                            <h3 className="inline-block bg-slate-800 text-white px-4 py-1 rounded-full text-sm font-bold mb-6 shadow-md">
                                                <i className="fa-regular fa-calendar mr-2"></i>{formatDate(date)}
                                            </h3>
                                            
                                            <div className="border-l-2 border-slate-300 ml-4 pl-6 space-y-8 relative">
                                                {groupedItinerary[date].map(item => (
                                                    <div key={item.id} className="relative">
                                                        {/* Timeline Dot */}
                                                        <div className="absolute -left-[31px] top-1 w-4 h-4 bg-indigo-500 rounded-full border-4 border-white shadow-sm"></div>
                                                        
                                                        <div className="flex flex-col md:flex-row md:justify-between md:items-start gap-2 mb-2">
                                                            <div>
                                                                <span className="font-bold text-indigo-600 mr-2">{item.time}</span>
                                                                <span className="text-lg font-bold text-slate-800">{item.name}</span>
                                                            </div>
                                                            {/* Show Fixed Cost if no options */}
                                                            {!item.hasOptions && item.cost > 0 && (
                                                                <span className="bg-green-100 text-green-700 px-3 py-1 rounded-lg text-sm font-bold">฿{item.cost.toLocaleString()}</span>
                                                            )}
                                                        </div>
                                                        
                                                        {item.desc && <p className="text-slate-600 text-sm mb-3 italic">"{item.desc}"</p>}

                                                        {/* --- PLAN A/B SELECTOR (The Interactive UI) --- */}
                                                        {item.hasOptions && (
                                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3">
                                                                {item.options.map(opt => {
                                                                    const isSelected = item.selectedOption === opt.id;
                                                                    return (
                                                                        <label key={opt.id} className="cursor-pointer">
                                                                            <input type="radio" name={`choice-${item.id}`} className="hidden option-input" 
                                                                                   checked={isSelected} onChange={() => handleOptionSelect(item.id, opt.id)} />
                                                                            <div className="option-card border-2 border-slate-200 bg-white p-4 rounded-xl transition-all duration-200 flex justify-between items-center h-full">
                                                                                <div>
                                                                                    <div className={`font-bold ${isSelected ? 'text-blue-700' : 'text-slate-700'}`}>{opt.label}</div>
                                                                                    {opt.desc && <div className="text-xs text-slate-500 mt-1">{opt.desc}</div>}
                                                                                </div>
                                                                                <div className="text-right ml-2 flex-shrink-0">
                                                                                    <div className="font-bold text-green-600">฿{opt.cost.toLocaleString()}</div>
                                                                                    <i className="fa-solid fa-circle-check text-blue-500 text-xl hidden check-icon mt-1"></i>
                                                                                </div>
                                                                            </div>
                                                                        </label>
                                                                    )
                                                                })}
                                                            </div>
                                                        )}
                                                        
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* STICKY TOTAL BAR (Floats at bottom for real-time feedback) */}
                    <div className="fixed bottom-4 left-4 right-4 md:left-auto md:right-10 md:w-[400px] sticky-summary animate-pop" style={{animationDelay: '0.5s'}}>
                        <div>
                            <div className="text-xs text-slate-300 font-medium">รวมค่าใช้จ่ายกองกลาง</div>
                            <div className="text-2xl font-bold">฿{totalCost.toLocaleString()}</div>
                        </div>
                        <div className="text-right border-l border-slate-600 pl-4">
                            <div className="text-xs text-slate-300 font-medium">หาร {members.length} คน</div>
                            <div className="text-2xl font-bold text-green-400">฿{Math.ceil(costPerPerson).toLocaleString()}</div>
                        </div>
                    </div>

                    {/* Modals */}
                    {modals.members && (
                        <Modal title="จัดการสมาชิก" onClose={() => toggleModal('members')}>
                            <form onSubmit={addMember} className="flex gap-2 mb-6">
                                <input name="name" type="text" placeholder="ชื่อไอ่เหี้ยสักคน..." required className="flex-1 px-4 py-2 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500 bg-slate-50" />
                                <button type="submit" className="bg-indigo-500 text-white px-4 py-2 rounded-xl font-medium">เพิ่ม</button>
                            </form>
                            <div className="flex flex-col gap-2">
                                {members.map(m => (
                                    <div key={m.id} className="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-200">
                                        <span className="font-medium">{m.name}</span>
                                        <button onClick={() => removeMember(m.id)} className="text-red-400 hover:text-red-600"><i className="fa-solid fa-trash"></i></button>
                                    </div>
                                ))}
                            </div>
                        </Modal>
                    )}
                    
                    {modals.plan && (
                        <Modal title="เพิ่มแพลนยิบย่อย" onClose={() => toggleModal('plan')}>
                            <form onSubmit={addPlan} className="flex flex-col gap-3">
                                <div className="flex gap-2">
                                    <input name="date" type="date" required defaultValue="2026-10-24" className="w-1/2 px-4 py-2 rounded-xl border border-slate-300 focus:outline-none bg-slate-50" />
                                    <input name="time" type="time" required className="w-1/2 px-4 py-2 rounded-xl border border-slate-300 focus:outline-none bg-slate-50" />
                                </div>
                                <input name="name" type="text" placeholder="จะทำอะไร" required className="px-4 py-2 rounded-xl border border-slate-300 focus:outline-none bg-slate-50" />
                                <input name="desc" type="text" placeholder="หมายเหตุ / คำด่า" className="px-4 py-2 rounded-xl border border-slate-300 focus:outline-none bg-slate-50" />
                                <input name="cost" type="number" placeholder="ค่าใช้จ่าย (บาท) ใส่ 0 ถ้าไม่มี" defaultValue="0" className="px-4 py-2 rounded-xl border border-slate-300 focus:outline-none bg-slate-50" />
                                <button type="submit" className="bg-indigo-500 text-white px-6 py-2 rounded-xl font-bold mt-2">เพิ่มข้อมูล</button>
                            </form>
                            <div className="mt-6 border-t pt-4 max-h-40 overflow-y-auto">
                                <p className="text-sm text-slate-500 mb-2">ข้อมูลที่กำหนดตายตัวแล้ว (ลบได้):</p>
                                {itinerary.filter(i=>!i.hasOptions).map(i => (
                                    <div key={i.id} className="flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-200 mb-2 text-sm">
                                        <span>{i.time} - {i.name}</span>
                                        <button onClick={() => removePlan(i.id)} className="text-red-400 hover:text-red-600 p-1"><i className="fa-solid fa-trash"></i></button>
                                    </div>
                                ))}
                            </div>
                        </Modal>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
