<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌴 ทริปล่มจม เกาะสีชัง 🌊</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { glass: 'rgba(255, 255, 255, 0.45)', glassDark: 'rgba(255, 255, 255, 0.65)' }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #f0f4f8; color: #1f2937; overflow-x: hidden; scroll-behavior: smooth; }
        
        /* Liquid Glass Background */
        .glass-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.6; animation: moveBlobs 20s infinite alternate; }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #ff9a9e; }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #fecfef; animation-delay: -5s; }
        .blob-3 { top: 40%; left: 30%; width: 40vw; height: 40vw; background: #a1c4fd; animation-delay: -10s; }
        @keyframes moveBlobs { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-5vw, 10vh) scale(0.9); } }

        /* Glass Components */
        .glass-card { background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 24px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05); transition: transform 0.3s; }
        .glass-card:hover { box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.08); }
        
        /* Animations */
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.5); } 70% { box-shadow: 0 0 0 10px rgba(139, 92, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); } }
        .active-seat { animation: pulseGlow 1.5s infinite; }

        /* Winding Path Timeline CSS (Zigzag) */
        .wavy-timeline { position: relative; padding-top: 2rem; padding-bottom: 2rem; }
        .wavy-timeline::before {
            content: ''; position: absolute; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); width: 8px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="8" height="200" viewBox="0 0 8 200"><path d="M4,0 C-15,50 23,150 4,200" fill="none" stroke="%2394a3b8" stroke-width="4" stroke-dasharray="8,8" /></svg>') repeat-y;
            z-index: 0; opacity: 0.6;
        }
        @media (max-width: 768px) { .wavy-timeline::before { left: 24px; } }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="glass-bg"><div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const initialMembers = [
            { id: 1, name: 'บิว' }, { id: 2, name: 'ต้นหอม' }, { id: 3, name: 'เบส' }, { id: 4, name: 'ที' },
            { id: 5, name: 'ฟิว' }, { id: 6, name: 'เฟิร์ส' }, { id: 7, name: 'แอ็ค' }, { id: 8, name: 'เพื่อนคนที่ 8' }
        ];

        const initialCars = [
            { id: 1, name: 'รถคันที่ 1', maxSeats: 4, occupants: {} },
            { id: 2, name: 'รถคันที่ 2', maxSeats: 4, occupants: {} }
        ];

        const formatDate = (dateStr) => {
            const options = { day: 'numeric', month: 'short', year: 'numeric' };
            return new Date(dateStr).toLocaleDateString('th-TH', options);
        };

        const App = () => {
            // States
            const [members, setMembers] = useState(initialMembers);
            const [cars, setCars] = useState(initialCars);
            const [activeMemberId, setActiveMemberId] = useState(null);

            // 🎯 Plan Selection State (ระบบเลือกตัวเลือก)
            const [plan, setPlan] = useState({
                travel: 'A',    // A: รถยนต์, B: รถไฟ
                boat: 'A',      // A: เรือธรรมดา, B: เรือเฟอรี่
                hotel: 'unseen', // unseen, paree, novo, chawley
                dinner1: 'chawley', // chawley, chomtawan
                night: 'beer'    // bar, beer
            });

            // Handlers
            const handlePlanChange = (key, value) => setPlan(prev => ({ ...prev, [key]: value }));

            // คำนวณค่าใช้จ่าย และ สร้าง Timeline แบบ Real-time ตามแผนที่เลือก
            const { itinerary, totalCost } = useMemo(() => {
                let timeline = [];
                let cost = 0;

                // --- วันที่ 24/10/2026 ---
                if (plan.travel === 'A') {
                    timeline.push({ date: '2026-10-24', time: '05:00', title: 'ออกเดินทางจากพิษณุโลก (รถยนต์ส่วนตัว/ตู้)', desc: 'ล้อหมุน อย่าเลท', cost: 0, icon: 'fa-car' });
                    timeline.push({ date: '2026-10-24', time: '05:30', title: 'เติมน้ำมัน หาของแดกไปด้วยอีเหี้ย', desc: 'ระหว่างทางจะกินข้าวเช้าข้าวเที่ยงเหี้ยอะไรก็เรื่องของพ่อมึง มีปากก็พูดสิไอ่สัส', cost: 2600, icon: 'fa-gas-pump' });
                    timeline.push({ date: '2026-10-24', time: '12:30', title: 'ถึงแถวท่าเรือเกาะลอย (หาที่จอดรถ)', desc: 'ค่าจอดรถประเมิณไว้ 2 คัน', cost: 500, icon: 'fa-square-parking' });
                    cost += 3100;
                } else {
                    timeline.push({ date: '2026-10-24', time: '06:50', title: 'เจอกันที่สถานีกรุงเทพ (หัวลำโพง)', desc: 'ไปรถไฟ เหี้ยอะไรไม่รู้แต่ต้องมาเจอกัน เพื่อขึ้นขบวน 283 ตอน 6.55 น.', cost: 260, icon: 'fa-train' });
                    timeline.push({ date: '2026-10-24', time: '10:05', title: 'ถึงสถานีรถไฟ เขาพระบาท', desc: 'นั่งสองแถวเพื่อไปท่าเรือเกาะลอย', cost: 200, icon: 'fa-truck-fast' });
                    cost += 460;
                }

                if (plan.boat === 'A') {
                    timeline.push({ date: '2026-10-24', time: '13:00', title: 'เรือข้ามฟากธรรมดา (40 นาที)', desc: 'ออกจากท่าเรือเกาะลอยไปเกาะสีชัง', cost: 480, icon: 'fa-ship' });
                    cost += 480;
                } else {
                    timeline.push({ date: '2026-10-24', time: '13:00', title: 'เรือเฟอรี่ แสงประทีป (15-20 นาที)', desc: 'เหมาลำพรีเมียม ออกจากเกาะลอยไปเกาะสีชัง', cost: 2100, icon: 'fa-ship' });
                    cost += 2100;
                }

                const hotelCosts = { unseen: 10000, paree: 8000, novo: 9200, chawley: 12400 };
                const hotelNames = { unseen: 'เกาะสีชังอันซีนรีสอร์ท', paree: 'ปารีฮัท รีสอร์ท', novo: 'โนโวเทล เกาะสีชัง', chawley: 'ชาวบ้านชาวเล' };
                timeline.push({ date: '2026-10-24', time: '14:00', title: `เข้าที่พัก: ${hotelNames[plan.hotel]}`, desc: 'เดินทางถึงเกาะหารถเข้าที่พัก (นอนโง่ๆ อยู่ห้องบ้าง เหนื่อยไอ่สัส)', cost: hotelCosts[plan.hotel], icon: 'fa-bed' });
                cost += hotelCosts[plan.hotel];

                timeline.push({ date: '2026-10-24', time: '14:45', title: 'คาเฟ่เรือนซาร์เลวิช', desc: 'ไปถ่ายรูปสะพานอัษฎางค์', cost: 260, icon: 'fa-mug-hot' });
                cost += 260;
                timeline.push({ date: '2026-10-24', time: '15:00', title: 'ไหว้พระศาลเจ้าพ่อเขาใหญ่', desc: 'เอาฤกษ์เอาชัย', cost: 100, icon: 'fa-hands-praying' });
                cost += 100;
                timeline.push({ date: '2026-10-24', time: '16:30', title: 'เล่นน้ำหาดถ้ำพัง', desc: 'โดดน้ำให้ชื่นใจ', cost: 0, icon: 'fa-water' });
                
                const dinner1Cost = 2600;
                const dinner1Name = plan.dinner1 === 'chawley' ? 'ร้านชาวบ้านชาวเล (กลางๆ ติดหวาน)' : 'ร้านชมตะวัน (ได้มิชลิน)';
                timeline.push({ date: '2026-10-24', time: '18:00', title: `กินข้าวเย็น: ${dinner1Name}`, desc: 'กินข้าวเย็นบ้าง แดกแต่หญ้า', cost: dinner1Cost, icon: 'fa-utensils' });
                cost += dinner1Cost;

                const nightCost = plan.night === 'bar' ? 600 : 2000;
                const nightName = plan.night === 'bar' ? 'บาร์ (เอาฟีล)' : 'เบียร์ (เอาฟุบ)';
                timeline.push({ date: '2026-10-24', time: '20:30', title: `ปาร์ตี้กลางคืน: ${nightName}`, desc: 'พักผ่อนตามอัธยาศัย', cost: nightCost, icon: 'fa-beer-mug-empty' });
                cost += nightCost;

                // --- วันที่ 25/10/2026 ---
                timeline.push({ date: '2026-10-25', time: '07:00', title: 'ตื่นเช้าถ้ามีปัญญา', desc: 'ไปเดินตลาด ถ่ายรูปถ้ำทะลุ ช่องเขาขาด (ถ้าตอแหลหน่อยจะเล่นน้ำก็เรื่องของมึง)', cost: 0, icon: 'fa-camera' });
                timeline.push({ date: '2026-10-25', time: '08:30', title: 'ข้าวเช้า (โรงแรม/อิสระ)', desc: 'ไม่รู้โรงแรมมีให้ไหม แต่พนันว่าถ้าไม่ตื่นมีก็ไม่แดกกันแน่นอน อยากจะไปไหนก็ไป กลับมาเช็คเอาท์ก่อนเที่ยง', cost: 0, icon: 'fa-bowl-food' });

                if (plan.boat === 'A') {
                    timeline.push({ date: '2026-10-25', time: '13:00', title: 'เรือข้ามฟากธรรมดา (ขากลับ)', desc: 'เจอกันที่ท่าเรือ นั่งกลับฝั่ง', cost: 480, icon: 'fa-ship' });
                    cost += 480;
                } else {
                    timeline.push({ date: '2026-10-25', time: '13:00', title: 'เรือเฟอรี่ แสงประทีป (ขากลับ)', desc: 'เจอกันที่ท่าเรือ นั่งกลับฝั่ง', cost: 2100, icon: 'fa-ship' });
                    cost += 2100;
                }

                timeline.push({ date: '2026-10-25', time: '14:00', title: 'เดินทางไป Pool Villa หาดวอน', desc: 'เตรียมตัวปาร์ตี้รอบสอง', cost: 5600, icon: 'fa-house-swimming' });
                cost += 5600;
                timeline.push({ date: '2026-10-25', time: '15:00', title: 'Free Time สุดสัปดาห์', desc: 'ตัวเลือกหลังจากนี้มีมากมาย ท่านจะไปคาเฟ่ชลบุรี ไปตลาดหาซื้อไรกิน ไปเล่นน้ำบางแสน หรือไปเดินห้างก็เรื่องของท่าน', cost: 0, icon: 'fa-person-walking-luggage' });
                timeline.push({ date: '2026-10-25', time: '18:00', title: 'มื้อใหญ่กับเพื่อน', desc: 'ไม่ว่าท่านจะไปไหน กลับมาหาอะไรทานมื้อใหญ่ด้วยกัน', cost: 2600, icon: 'fa-burger' });
                cost += 2600;

                // --- วันที่ 26/10/2026 ---
                timeline.push({ date: '2026-10-26', time: '09:30', title: 'ตื่นนอนเก็บของ', desc: 'เช็คสัมภาระ เตรียมตัวกลับโลกความจริง', cost: 0, icon: 'fa-suitcase' });
                timeline.push({ date: '2026-10-26', time: '10:30', title: 'หาอะไรกินแล้วเดินทางกลับ', desc: 'หาอะไรกินแล้วก็กลับได้แล้วไอ่เหี้ย (ตอนกลับเหมือนกับขามา แค่ย้อนกลับ)', cost: 0, icon: 'fa-road' });

                // จัดกลุ่มตามวันที่
                const groupedTimeline = timeline.reduce((acc, item) => {
                    if (!acc[item.date]) acc[item.date] = [];
                    acc[item.date].push(item);
                    return acc;
                }, {});

                return { itinerary: groupedTimeline, totalCost: cost };
            }, [plan]);

            // Seating Handlers
            const handlePoolClick = (id) => setActiveMemberId(activeMemberId === id ? null : id);
            const handleSeatClick = (carId, seatIndex) => {
                const carIndex = cars.findIndex(c => c.id === carId);
                const newCars = [...cars];
                if (activeMemberId) {
                    newCars.forEach(c => { Object.keys(c.occupants).forEach(k => { if (c.occupants[k] === activeMemberId) delete c.occupants[k]; }); });
                    newCars[carIndex].occupants = { ...newCars[carIndex].occupants, [seatIndex]: activeMemberId };
                    setCars(newCars); setActiveMemberId(null);
                } else if (newCars[carIndex].occupants[seatIndex]) {
                    delete newCars[carIndex].occupants[seatIndex]; setCars(newCars);
                }
            };

            const seatedMemberIds = useMemo(() => {
                const ids = new Set(); cars.forEach(car => Object.values(car.occupants).forEach(id => ids.add(id))); return ids;
            }, [cars]);
            const unseatedMembers = members.filter(m => !seatedMemberIds.has(m.id));

            return (
                <div className="max-w-5xl mx-auto px-4 py-12 flex flex-col gap-10">
                    
                    {/* Header */}
                    <div className="glass-card p-10 text-center">
                        <h1 className="text-4xl md:text-6xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-orange-500 to-pink-500 mb-4 animate-pop">🌴 ทริปล่มจม เกาะสีชัง 🌊</h1>
                        <p className="text-lg text-gray-700 font-medium">พิษณุโลก ➔ ชลบุรี ➔ เกาะสีชัง (24-26 ต.ค. 2026)</p>
                    </div>

                    {/* Section 1: Dashboard & Plan Selector */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-pop" style={{animationDelay: '0.1s'}}>
                        {/* Plan Configurator */}
                        <div className="lg:col-span-2 glass-card p-6">
                            <h2 className="text-2xl font-bold mb-4 border-b border-gray-300/50 pb-2"><i className="fa-solid fa-sliders text-blue-500 mr-2"></i> ปรับแต่งแผนการเดินทาง (Plan Selector)</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="bg-white/50 p-3 rounded-xl">
                                    <p className="font-semibold text-sm text-gray-600 mb-2">🚗 การเดินทางจากพิดโลก</p>
                                    <div className="flex gap-2">
                                        <button onClick={()=>handlePlanChange('travel', 'A')} className={`flex-1 py-2 rounded-lg font-medium text-sm transition-all ${plan.travel==='A'?'bg-blue-500 text-white shadow-md':'bg-white text-gray-600 hover:bg-gray-100'}`}>A: ขับรถ/รถตู้</button>
                                        <button onClick={()=>handlePlanChange('travel', 'B')} className={`flex-1 py-2 rounded-lg font-medium text-sm transition-all ${plan.travel==='B'?'bg-blue-500 text-white shadow-md':'bg-white text-gray-600 hover:bg-gray-100'}`}>B: นั่งรถไฟ</button>
                                    </div>
                                </div>
                                <div className="bg-white/50 p-3 rounded-xl">
                                    <p className="font-semibold text-sm text-gray-600 mb-2">⛴️ เรือข้ามเกาะ</p>
                                    <div className="flex gap-2">
                                        <button onClick={()=>handlePlanChange('boat', 'A')} className={`flex-1 py-2 rounded-lg font-medium text-sm transition-all ${plan.boat==='A'?'bg-teal-500 text-white shadow-md':'bg-white text-gray-600 hover:bg-gray-100'}`}>A: ข้ามฟากปกติ</button>
                                        <button onClick={()=>handlePlanChange('boat', 'B')} className={`flex-1 py-2 rounded-lg font-medium text-sm transition-all ${plan.boat==='B'?'bg-teal-500 text-white shadow-md':'bg-white text-gray-600 hover:bg-gray-100'}`}>B: เหมาเฟอรี่</button>
                                    </div>
                                </div>
                                <div className="bg-white/50 p-3 rounded-xl md:col-span-2">
                                    <p className="font-semibold text-sm text-gray-600 mb-2">🏨 ที่พักเกาะสีชัง</p>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                        <button onClick={()=>handlePlanChange('hotel', 'unseen')} className={`py-2 rounded-lg font-medium text-xs transition-all ${plan.hotel==='unseen'?'bg-orange-500 text-white shadow-md':'bg-white text-gray-600 hover:bg-gray-100'}`}>อันซีนรีสอร์ท</button>
                                        <button onClick={()=>handlePlanChange('hotel', 'paree')} className={`py-2 rounded-lg font-medium text-xs transition-all ${plan.hotel==='paree'?'bg-orange-500 text-white shadow-md':'bg-white text-gray-600 hover:bg-gray-100'}`}>ปารีฮัท</button>
                                        <button onClick={()=>handlePlanChange('hotel', 'novo')} className={`py-2 rounded-lg font-medium text-xs transition-all ${plan.hotel==='novo'?'bg-orange-500 text-white shadow-md':'bg-white text-gray-600 hover:bg-gray-100'}`}>โนโวเทล</button>
                                        <button onClick={()=>handlePlanChange('hotel', 'chawley')} className={`py-2 rounded-lg font-medium text-xs transition-all ${plan.hotel==='chawley'?'bg-orange-500 text-white shadow-md':'bg-white text-gray-600 hover:bg-gray-100'}`}>ชาวเล</button>
                                    </div>
                                </div>
                                <div className="bg-white/50 p-3 rounded-xl">
                                    <p className="font-semibold text-sm text-gray-600 mb-2">🦞 ร้านอาหารเย็น</p>
                                    <div className="flex gap-2">
                                        <button onClick={()=>handlePlanChange('dinner1', 'chawley')} className={`flex-1 py-2 rounded-lg font-medium text-sm transition-all ${plan.dinner1==='chawley'?'bg-pink-500 text-white shadow-md':'bg-white text-gray-600 hover:bg-gray-100'}`}>ชาวเล (ติดหวาน)</button>
                                        <button onClick={()=>handlePlanChange('dinner1', 'chomtawan')} className={`flex-1 py-2 rounded-lg font-medium text-sm transition-all ${plan.dinner1==='chomtawan'?'bg-pink-500 text-white shadow-md':'bg-white text-gray-600 hover:bg-gray-100'}`}>ชมตะวัน (มิชลิน)</button>
                                    </div>
                                </div>
                                <div className="bg-white/50 p-3 rounded-xl">
                                    <p className="font-semibold text-sm text-gray-600 mb-2">🍻 ปาร์ตี้กลางคืน</p>
                                    <div className="flex gap-2">
                                        <button onClick={()=>handlePlanChange('night', 'bar')} className={`flex-1 py-2 rounded-lg font-medium text-sm transition-all ${plan.night==='bar'?'bg-violet-500 text-white shadow-md':'bg-white text-gray-600 hover:bg-gray-100'}`}>บาร์ (เอาฟีล)</button>
                                        <button onClick={()=>handlePlanChange('night', 'beer')} className={`flex-1 py-2 rounded-lg font-medium text-sm transition-all ${plan.night==='beer'?'bg-violet-500 text-white shadow-md':'bg-white text-gray-600 hover:bg-gray-100'}`}>เบียร์ (เอาฟุบ)</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Cost Summary Box */}
                        <div className="glass-card p-6 flex flex-col justify-center items-center bg-gradient-to-br from-green-400/20 to-teal-500/20">
                            <h2 className="text-xl font-bold mb-2"><i className="fa-solid fa-sack-dollar text-green-600 mr-2"></i> สรุปงบกองกลาง</h2>
                            <p className="text-sm text-gray-600 text-center mb-4">อิงตามแผนตัวเลือกด้านซ้าย</p>
                            <div className="bg-white/80 p-5 rounded-2xl w-full text-center shadow-inner mb-4">
                                <p className="text-gray-500 font-medium">รวมทั้งหมด</p>
                                <p className="text-3xl font-bold text-gray-800">฿{totalCost.toLocaleString()}</p>
                            </div>
                            <div className="bg-gradient-to-r from-green-500 to-teal-500 p-4 rounded-2xl w-full text-center shadow-lg text-white">
                                <p className="font-medium text-green-50">หารเฉลี่ย ({members.length} คน)</p>
                                <p className="text-3xl font-bold mt-1">฿{Math.ceil(totalCost/members.length).toLocaleString()}</p>
                            </div>
                        </div>
                    </div>

                    {/* Section 2: Members & Seating */}
                    <div className="glass-card p-8 animate-pop" style={{animationDelay: '0.2s'}}>
                        <h2 className="text-2xl font-bold text-gray-800 mb-6 border-b border-gray-300/50 pb-2"><i className="fa-solid fa-users text-pink-500 mr-2"></i> สมาชิก & การเดินทาง</h2>
                        
                        {plan.travel === 'A' ? (
                            <div>
                                <p className="text-sm text-gray-600 mb-4 bg-white/50 p-3 rounded-xl inline-block border border-white/60">
                                    <i className="fa-solid fa-hand-pointer mr-1"></i> <b>จัดที่นั่งรถ:</b> แตะชื่อคนด้านล่าง แล้วแตะเบาะว่างในรถ
                                </p>
                                <div className="mb-6 p-4 bg-white/30 rounded-2xl border border-white/50">
                                    <h3 className="text-sm font-semibold text-gray-700 mb-3">จุดรอขึ้นรถ:</h3>
                                    <div className="flex flex-wrap gap-2">
                                        {unseatedMembers.map(m => (
                                            <button key={m.id} onClick={() => handlePoolClick(m.id)}
                                                className={`px-4 py-2 rounded-full font-medium transition-all duration-300 border ${activeMemberId === m.id ? 'bg-violet-500 text-white border-violet-600 shadow-lg transform scale-110 active-seat' : 'bg-white/80 text-gray-800 border-white hover:bg-white hover:scale-105'}`}>
                                                {m.name}
                                            </button>
                                        ))}
                                        {unseatedMembers.length === 0 && <span className="text-gray-500 text-sm italic">ขึ้นรถครบแล้วจ้า</span>}
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {cars.map(car => (
                                        <div key={car.id} className="bg-white/40 rounded-2xl p-5 border border-white/60 shadow-sm hover:bg-white/60 transition-colors">
                                            <div className="text-lg font-bold text-center mb-4 border-b border-gray-300/50 pb-2">🚗 {car.name} <span className="text-sm font-normal text-gray-500">({Object.keys(car.occupants).length}/{car.maxSeats})</span></div>
                                            <div className="grid grid-cols-2 gap-3 justify-items-center">
                                                {Array.from({length: car.maxSeats}).map((_, idx) => {
                                                    const occupant = members.find(m => m.id === car.occupants[idx]);
                                                    return (
                                                        <button key={idx} onClick={() => handleSeatClick(car.id, idx)}
                                                            className={`w-full max-w-[120px] h-12 rounded-xl font-medium border-2 transition-all ${occupant ? 'bg-pink-200 border-pink-400 text-pink-900 shadow-sm' : 'bg-black/5 border-dashed border-gray-400/50 text-gray-400 hover:bg-black/10'}`}>
                                                            {occupant ? occupant.name : <i className="fa-solid fa-chair opacity-50"></i>}
                                                        </button>
                                                    )
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <div className="bg-white/50 p-8 rounded-2xl border border-white/60 text-center">
                                <i className="fa-solid fa-train text-5xl text-blue-400 mb-4"></i>
                                <h3 className="text-xl font-bold text-gray-800">แผนเดินทางด้วยรถไฟ</h3>
                                <p className="text-gray-600 mt-2">ไปเจอกันที่หัวลำโพงเลย ไม่ต้องจัดที่นั่งโว้ย!</p>
                                <div className="mt-6 flex flex-wrap justify-center gap-2">
                                    {members.map(m => <span key={m.id} className="px-3 py-1 bg-white border border-gray-200 rounded-full text-sm">{m.name}</span>)}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Section 3: Winding Timeline */}
                    <div className="glass-card p-8 pb-20 animate-pop" style={{animationDelay: '0.3s'}}>
                        <h2 className="text-2xl font-bold text-gray-800 mb-10 text-center"><i className="fa-solid fa-route text-orange-500 mr-2"></i> แผนการเดินทาง & กิจกรรม</h2>
                        
                        <div className="wavy-timeline">
                            {/* Sticky Indicator */}
                            <div className="sticky top-1/2 left-0 md:left-1/2 transform md:-translate-x-1/2 -translate-y-1/2 z-20 w-8 h-8 pointer-events-none hidden md:flex justify-center">
                                <div className="bg-white shadow-lg border-4 border-orange-400 rounded-full w-12 h-12 flex items-center justify-center text-xl text-orange-500 animate-bounce">
                                    <i className="fa-solid fa-map-location-dot"></i>
                                </div>
                            </div>

                            {Object.keys(itinerary).map((dateKey) => (
                                <div key={dateKey} className="mb-14 relative z-10">
                                    <div className="flex justify-center mb-8">
                                        <span className="px-6 py-2 rounded-full font-bold shadow-md text-white bg-gradient-to-r from-orange-400 to-pink-500">
                                            <i className="fa-regular fa-calendar-check mr-2"></i>{formatDate(dateKey)}
                                        </span>
                                    </div>
                                    
                                    <div className="flex flex-col gap-10">
                                        {itinerary[dateKey].map((item, index) => {
                                            const isLeft = index % 2 === 0;
                                            return (
                                                <div key={item.time+item.title} className={`flex flex-col md:flex-row w-full ${isLeft ? 'md:justify-start pl-12 md:pl-0' : 'md:justify-end pl-12 md:pl-0'} items-center group`}>
                                                    
                                                    {/* Mobile dot */}
                                                    <div className="md:hidden absolute left-[20px] w-4 h-4 rounded-full border-2 border-orange-400 bg-white z-20"></div>

                                                    <div className={`w-full md:w-[45%] p-5 bg-white/80 backdrop-blur-md rounded-2xl shadow-sm border border-white transition-all duration-300 hover:-translate-y-2 hover:shadow-xl ${isLeft ? 'md:mr-8' : 'md:ml-8'}`}>
                                                        <div className="flex justify-between items-start mb-2 border-b border-gray-200 pb-2">
                                                            <div className="font-bold text-orange-600 text-lg flex items-center gap-2">
                                                                <i className="fa-regular fa-clock"></i> {item.time}
                                                            </div>
                                                            {item.cost > 0 && <span className="bg-green-100 text-green-700 px-3 py-1 rounded-lg text-xs font-bold border border-green-200 shadow-sm whitespace-nowrap ml-2">฿{item.cost.toLocaleString()}</span>}
                                                        </div>
                                                        <h4 className="text-lg font-bold text-gray-800 mb-1"><i className={`fa-solid ${item.icon} text-gray-400 mr-2`}></i>{item.title}</h4>
                                                        <p className="text-sm text-gray-600">{item.desc}</p>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <p className="text-center text-gray-500 text-sm pb-10">❤️ Made for Koh Sichang Trip (ขอให้ได้ไปจริงๆ สาธุ)</p>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
    </script>
</body>
</html>
